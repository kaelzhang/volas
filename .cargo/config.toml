# x86-64: enable FMA3 (in every x86 CPU since Haswell / 2013) so the explicit
# `f64::mul_add` of the exact-arithmetic helpers — the error-free products and
# remainders of the exact window sums and means (volas-compute `accum`, used by every
# SMA / WMA / variance / regression row) and of correctly rounded decimal rounding
# (volas-core `decimal`) — inlines to a hardware `vfmadd231sd` instead of a libm `fma()`
# call. It does not turn on FP contraction, so no arithmetic changes: the TA-Lib-order
# recurrences (EMA / Wilder family, Hilbert transform) contain no `mul_add` and compile to
# the same separate multiply and add with or without it. aarch64 (Apple Silicon / ARM
# servers) has FMA in the baseline ISA, so this is x86-only.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-feature=+fma"]
