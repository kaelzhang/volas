[workspace]
resolver = "2"
members = [
  "crates/volas-core",
  "crates/volas-compute",
  "crates/volas-directive",
  "crates/volas-io",
  "crates/volas-time",
  "crates/volas-arrow",
  "crates/volas-python",
  "crates/volas",
]

[workspace.package]
version = "3.0.3"
edition = "2021"
authors = ["Kael Zhang <i+pypi@kael.me>"]
license = "MIT"
homepage = "https://github.com/kaelzhang/volas"
repository = "https://github.com/kaelzhang/volas"

# Internal crate deps, version-pinned here so `cargo publish` resolves them on
# crates.io (a path-only dep cannot be published). The versions equal
# [workspace.package].version and are bumped together by scripts/bump_version.py.
# Members reference these via `{ workspace = true }`.
[workspace.dependencies]
volas-core = { path = "crates/volas-core", version = "3.0.3" }
volas-compute = { path = "crates/volas-compute", version = "3.0.3" }
volas-directive = { path = "crates/volas-directive", version = "3.0.3" }
volas-time = { path = "crates/volas-time", version = "3.0.3" }
volas-io = { path = "crates/volas-io", version = "3.0.3" }
volas-arrow = { path = "crates/volas-arrow", version = "3.0.3" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
