[workspace]
resolver = "2"
members = [
  "crates/volas-core",
  "crates/volas-compute",
  "crates/volas-directive",
  "crates/volas-io",
  "crates/volas-time",
  "crates/volas-python",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Kael Zhang <i+pypi@kael.me>"]
license = "MIT"
homepage = "https://github.com/kaelzhang/volas"
repository = "https://github.com/kaelzhang/volas"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
