name: pages

# Publish the benchmark report to GitHub Pages
# (https://volas.ost.ai), so the README's performance link points at
# a live, always-reachable report instead of a git-ignored local HTML file.
#
# The full benchmark (every comparison library + the 3 report sections) is heavy
# (~5 min, plus TA-Lib), so it does NOT run on every push: on demand, weekly, and
# on a push to `main`. (One-time setup: repo Settings -> Pages -> Source =
# "GitHub Actions".)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC — keep the published report fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build benchmark report
    # macOS provides the Monaco system font used by the explainer GIFs. Noto
    # Sans SC is downloaded by the generator from Google Fonts for repeatable
    # Chinese text rendering.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: python -m pip install --upgrade pip maturin pillow

      - name: Prepare animated GIF fonts
        run: python docs/animated_gif/generate_gif.py --ensure-fonts --check-fonts --strict-fonts --no-render

      - name: Build the benchmark report
        # `make benchmark` installs the dev + benchmark comparison libraries
        # (pandas / stock-pandas / TA-Lib / polars), builds the release extension,
        # runs the full benchmark, and writes ./benchmark-report.html.
        run: make benchmark

      - name: Build animated explainer GIFs
        run: |
          mkdir -p _site/animated_gif
          python docs/animated_gif/generate_gif.py --out-dir _site/animated_gif --strict-fonts

      - name: Assemble the Pages site
        # CNAME pins the custom domain (https://volas.ost.ai) so a Pages deploy
        # can never silently reset it to the github.io default.
        run: |
          cp benchmark-report.html _site/index.html
          echo "volas.ost.ai" > _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
