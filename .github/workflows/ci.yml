name: ci

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*"
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy is required for type ANALYSIS, not just runtime: volas_rs.pyi types
      # boolean masks as `npt.NDArray[np.bool_]`. Without numpy installed,
      # `ignore_missing_imports` silently degrades those annotations to Any, which
      # widens the first `.loc` __getitem__ overload until mypy (correctly) flags
      # the narrower ones as unreachable [overload-cannot-match].
      - name: Install ruff, mypy and numpy
        run: python -m pip install ruff mypy numpy

      - name: ruff (package + tests)
        run: ruff check volas test

      - name: mypy (package)
        run: mypy volas

      # Pinned (not @stable): clippy is a hard gate (`-D warnings`), so a newer stable
      # clippy adding a lint must not spuriously fail CI on unrelated PRs. Bump this
      # deliberately (and clear any new warnings) as a maintenance step.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo.lock is in sync (release builds pass --locked)
        run: cargo metadata --locked --format-version 1 > /dev/null

  test:
    name: test / py${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          # `.[dev]` only -- the benchmark comparison libraries (polars / TA-Lib /
          # DuckDB, in the `benchmark` extra) are NOT needed to run the tests;
          # they are installed only by `make benchmark`.
          pip install -e .[dev]
          python -c "import sys, numpy as np; print(sys.version); print('numpy', np.__version__)"

      - name: Rust unit tests
        run: cargo test --workspace --exclude volas-python

      - name: Build the extension
        run: maturin develop --release

      # Fast functional run across the Python matrix; the combined Python+Rust
      # coverage report is produced once by the dedicated `coverage` job below
      # (which has the llvm-tools / cargo-llvm-cov toolchain).
      - name: Python tests
        run: make test-quick

  coverage:
    name: coverage / codecov
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e .[dev]

      # Runs the cargo unit tests and the pytest suite (against the instrumented
      # extension) and writes their per-line union to target/volas-cov/union.lcov.
      - name: True-union coverage (cargo ∪ pytest)
        run: make coverage

      - name: Upload coverage to Codecov
        # Always upload — even if `make coverage` failed the < 100% gate above —
        # so Codecov still gets the PR's coverage (the lcov is written before the
        # gate exits) and can annotate exactly which lines regressed.
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: target/volas-cov/union.lcov
          # ONLY the true union. Without this, the Codecov CLI auto-searches the
          # working tree and also finds the partial cargo.lcov / pytest.lcov beside
          # it; merging those re-introduces the LCOV_EXCL_LINE defensive lines
          # (DA:X,0 there, deliberately dropped from the union) as phantom misses,
          # so Codecov reported 99.81% while the gate is a true 100%.
          disable_search: true
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  types:
    name: types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e .[dev]

      - name: Build the extension (installs the stub + py.typed)
        run: maturin develop --release

      # Deterministic type gates — prove the shipped typings are correct without review:
      # stub == runtime, the dynamic overloads resolve right, misuse is flagged, and the
      # public API is 100% typed. Any future Rust change that breaks the stub fails here.
      - name: Type gates (stubtest + mypy + pyright + verifytypes)
        run: |
          python -m mypy.stubtest volas_rs --allowlist stubtest_allowlist.txt
          mypy --strict test/typing/check_types.py test/typing/negative_types.py
          pyright test/typing/check_types.py test/typing/negative_types.py
          pyright --verifytypes volas --ignoreexternal

  asm-diff:
    # Instruction-level regression gate for the hot kernels. The baseline
    # (scripts/asm_baseline.txt) is CPU-arch-specific, so this runs ONLY on an
    # Apple-silicon runner (arm64, `uname -m` = `arm64`) — the script self-skips on
    # any other arch. On a rustc/codegen bump that legitimately shifts a count,
    # refresh the baseline with `make asm-diff-update` and commit it.
    name: asm-diff (arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Instruction-level regression gate
        run: make asm-diff
