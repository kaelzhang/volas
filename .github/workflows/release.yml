name: release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: verify-tag-matches-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify the pushed tag matches the Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          echo "pushed tag:         $tag"
          echo "Cargo.toml version: $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::pushed tag '$tag' does not match the Cargo.toml version '$version'. Use 'make bump TYPE={major|minor|patch}' so the tag and the package version always agree."
            exit 1
          fi
          echo "OK: tag and version agree ($version)"
      - name: Verify Cargo.lock is in sync (the wheel builds pass --locked)
        run: |
          # A version bump (or any manifest change) that skips the lock makes
          # every --locked wheel job fail 20 builds later; fail HERE instead.
          lock="$(python3 -c "
          import tomllib
          d = tomllib.load(open('Cargo.lock','rb'))
          print(next(p['version'] for p in d['package'] if p['name'] == 'volas-core'))")"
          version="$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")"
          echo "Cargo.lock volas-core: $lock / Cargo.toml: $version"
          if [ "$lock" != "$version" ]; then
            echo "::error::Cargo.lock records volas-core $lock but Cargo.toml says $version — run 'cargo update --workspace' and commit the lock (make bump does this automatically)."
            exit 1
          fi

  build-wheels:
    name: wheel-${{ matrix.platform.label }}-py${{ matrix.python-version }}
    needs: verify-version
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        platform:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - label: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel (Linux)
        if: ${{ matrix.platform.os == 'ubuntu-latest' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist --interpreter ${{ matrix.python-version }}

      - name: Build wheel (macOS/Windows)
        if: ${{ matrix.platform.os != 'ubuntu-latest' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --interpreter python

      # Owner decision D4 (2026-06-12): a wheel must prove it imports and carries its
      # stubs before it can ship. The linux-aarch64 wheel is cross-compiled and cannot
      # run on the x86_64 build runner, so it is excluded here (its sibling platforms
      # exercise the identical code; only the target triple differs).
      - name: Smoke-test the wheel
        if: ${{ matrix.platform.label != 'linux-aarch64' }}
        shell: bash
        run: |
          python -m venv smoke-env
          if [ -e smoke-env/Scripts/python.exe ]; then PY=smoke-env/Scripts/python.exe; else PY=smoke-env/bin/python; fi
          "$PY" -m pip install --find-links dist volas
          "$PY" -c "import volas, volas_rs; df = volas.DataFrame({'close': [1.0, 2.0, 3.0]}); assert df['ma:2'].to_numpy()[-1] == 2.5; print('wheel smoke OK')"
          "$PY" -c "import importlib.util, pathlib; spec = importlib.util.find_spec('volas_rs'); root = pathlib.Path(spec.origin).parent; assert list(root.parent.rglob('volas_rs.pyi')), 'stub missing from the wheel'; print('stub present')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.label }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: sdist
    needs: verify-version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade pip maturin
          maturin sdist --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Publish the Rust crates to crates.io. Gated only on verify-version (NOT on the
  # wheel build): the core crates are pyo3-free and independent of the Python
  # pipeline, so a Python-side build flake should not block the Rust release. Order,
  # `--locked`, and the publish=false skip for volas-python all live in the
  # `cargo-publish` Make target (single source of truth). cargo publish builds +
  # verifies each crate and waits for it to index before the next dependent crate.
  # Re-publishing an already-released version fails loud (crates.io is append-only).
  publish-crates:
    name: publish-to-crates-io
    needs: verify-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token for crates.io Trusted Publishing
      contents: read # checkout
    steps:
      - uses: actions/checkout@v5
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived crates.io
      # token (auto-revoked when the job ends), so no long-lived CARGO_REGISTRY_TOKEN
      # secret is stored. Each crate must list this repo + the `release.yml` workflow as a
      # Trusted Publisher on crates.io (crate Settings -> Trusted Publishing; leave the
      # Environment field blank), after its one-time manual first publish.
      - name: Authenticate to crates.io (Trusted Publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates to crates.io (dependency order)
        run: make cargo-publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish:
    name: publish-to-pypi
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/volas

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Check artifacts
        run: ls -lh dist

      - name: twine check (metadata sanity before publish)
        run: |
          # maturin >= 1.14 emits PEP 639 metadata (License-File /
          # License-Expression, Metadata-Version 2.4). twine validates through
          # `packaging`, and the runner's SYSTEM packaging (24.0) predates
          # PEP 639 — pip leaves it untouched ("requirement satisfied") and
          # twine then rejects every wheel with "unrecognized field
          # 'license-file'". Upgrade packaging explicitly alongside twine.
          python -m pip install --upgrade twine "packaging>=25"
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
