name: perf-gate

# Performance-regression gate using the same isolated AB/BA paired measurement
# as make perf-ab. Relative load drift is shared by both sides; the unchanged
# gate consumes the median paired HEAD/base ratios and reports per-item noise.
# Missing or failed BASE plumbing skips comparison; HEAD failures fail the job.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history — needed to reach the parent / merge-base

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read build tool versions
        id: toolchain
        run: python scripts/check_toolchain.py --versions >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "maturin==${{ steps.toolchain.outputs.maturin }}"
          # The benchmark module imports the comparison libraries (pandas / polars / TA-Lib)
          # at collection time; the full gate measures every volas section
          # and the release-only cost bounds.
          python -m pip install --no-build-isolation -e '.[dev,benchmark]'

      - name: Check build prerequisites
        run: python scripts/check_toolchain.py

      - name: Resolve the base commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD || true)"
          else
            BASE="${{ github.event.before }}"
          fi
          # Use it only if it is a real, reachable commit (not empty, not the all-zeros
          # sentinel of a brand-new ref).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable parent commit — the gate will be skipped."
            BASE=""
          fi
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Benchmark paired BASE and HEAD
        if: ${{ env.BASE_SHA != '' }}
        env:
          VOLAS_PYTHON: ${{ github.workspace }}/.venv/bin/python
          PERF_AB_JSON_DIR: ${{ runner.temp }}/perf-pairs
        run: |
          STATUS=0
          bash scripts/perf_ab.sh "$BASE_SHA" || STATUS=$?
          if [ "$STATUS" = 2 ]; then
            echo "BASE build/benchmark failed — comparison skipped."
          elif [ "$STATUS" != 0 ] && [ ! -f "$RUNNER_TEMP/perf-pairs/head.json" ]; then
            exit "$STATUS"            # HEAD / comparison failure must fail the job
          fi
          # A measured regression is enforced by the Performance gate step below.

      - name: Performance gate
        run: |
          if [ -f "$RUNNER_TEMP/perf-pairs/base.json" ] && [ -f "$RUNNER_TEMP/perf-pairs/head.json" ]; then
            python scripts/perf_gate.py "$RUNNER_TEMP/perf-pairs/head.json" --base "$RUNNER_TEMP/perf-pairs/base.json"
          else
            echo "No complete paired comparison (first commit, or build/benchmark failed) — gate skipped."
          fi

      - name: Upload benchmark JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-json
          path: ${{ runner.temp }}/perf-pairs
          retention-days: 14
