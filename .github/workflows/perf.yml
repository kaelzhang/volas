name: perf-gate

# Performance-regression gate. The benchmark runs TWICE in this one job, on the SAME
# runner: once for this commit (HEAD) and once for its parent (the PR merge-base, or the
# previous tip on a push). scripts/perf_gate.py then compares volas's own median times
# between the two runs.
#
# Comparing HEAD against its parent on one machine is what makes the gate reliable: the
# runner's absolute speed AND its CPU microarchitecture both cancel, so the thresholds are
# architecture-independent and there is no stored baseline to drift across machines (a
# committed volas/TA-Lib-ratio baseline is meaningless here — that ratio is not portable
# from a dev machine to the x86 runner).
#
# Fail-safe: if the parent can't be resolved, or its build/benchmark fails, the gate is
# skipped rather than failed — a regression gate must never block CI on its own plumbing.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history — needed to reach the parent / merge-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          # The benchmark module imports the comparison libraries (pandas / polars / TA-Lib)
          # at collection time; the CI run times only volas (`-k "... and volas"`), which is
          # all the head-vs-base gate compares.
          pip install -e .[dev,benchmark]

      - name: Resolve the base commit
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD || true)"
          else
            BASE="${{ github.event.before }}"
          fi
          # Use it only if it is a real, reachable commit (not empty, not the all-zeros
          # sentinel of a brand-new ref).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable parent commit — the gate will be skipped."
            BASE=""
          fi
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"

      - name: Benchmark HEAD
        run: |
          maturin develop --release
          pytest test/test_benchmark.py -k "(test_coverage or test_api) and volas" \
            --benchmark-only --benchmark-sort=name \
            --benchmark-columns=median --benchmark-json="$RUNNER_TEMP/head.json" -q

      - name: Benchmark the base commit
        if: ${{ env.BASE_SHA != '' }}
        continue-on-error: true       # fail-safe: a base build/benchmark failure skips the gate
        run: |
          git checkout --quiet --force "$BASE_SHA"
          maturin develop --release
          pytest test/test_benchmark.py -k "(test_coverage or test_api) and volas" \
            --benchmark-only --benchmark-sort=name \
            --benchmark-columns=median --benchmark-json="$RUNNER_TEMP/base.json" -q

      - name: Restore HEAD
        if: ${{ always() }}           # ensure the gate runs against HEAD's perf_gate.py
        run: git checkout --quiet --force "$HEAD_SHA"

      - name: Performance gate
        run: |
          if [ -f "$RUNNER_TEMP/base.json" ]; then
            python scripts/perf_gate.py "$RUNNER_TEMP/head.json" --base "$RUNNER_TEMP/base.json"
          else
            echo "No base benchmark (first commit, or the base build/benchmark failed) — gate skipped."
          fi

      - name: Upload benchmark JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: ${{ runner.temp }}/*.json
          retention-days: 14
