name: perf-gate

# Performance regression gate. Runs the coverage (vs TA-Lib) and core-API (vs
# pandas/polars) benchmark sections and fails if any item regresses past the
# threshold relative to the committed baseline (scripts/perf_baseline.json). The
# gate compares volas-vs-reference *ratios*, which are machine-independent (both run
# in the same job), so it is robust to the runner-to-runner speed variation that
# makes absolute-time gates flaky on shared CI.

on:
  push:
    branches:
      - master
      - main
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          # `benchmark` extra brings polars; `dev` brings pandas + TA-Lib (the
          # references the gate compares volas against).
          pip install -e .[dev,benchmark]

      - name: Build the extension (release)
        run: maturin develop --release

      - name: Run the benchmark (coverage + core API)
        run: |
          mkdir -p .benchmarks
          pytest test/test_benchmark.py -k "test_coverage or test_api" \
            --benchmark-only --benchmark-sort=name \
            --benchmark-columns=median --benchmark-json=.benchmarks/ci.json -q

      - name: Performance gate
        run: |
          python scripts/perf_gate.py .benchmarks/ci.json \
            --baseline scripts/perf_baseline.json --threshold 0.25

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: .benchmarks/ci.json
          retention-days: 14
