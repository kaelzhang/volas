name: perf-gate

# Performance regression gate. Runs the coverage (vs TA-Lib) and core-API (vs
# pandas/polars) benchmark sections and fails if a *stable* item regresses past the
# threshold relative to the committed baseline (scripts/perf_baseline.json). The gate
# compares volas-vs-reference *ratios* (both candidates run in the same job, so the
# runner's absolute speed cancels) and excludes the noise-dominated items — the
# candlestick family and sub-microsecond references — whose ratios swing run-to-run
# regardless of machine (see scripts/perf_gate.py).
#
# The baseline is environment-specific: the volas/TA-Lib ratio differs by architecture
# (a dev-machine baseline systematically mismatches the x86 CI runner). Regenerate it ON
# CI, not locally: run this workflow manually with `update_baseline: true` and commit the
# uploaded `perf-baseline` artifact.

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Regenerate scripts/perf_baseline.json from this CI run (x86) and upload it"
        type: boolean
        default: false

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    name: perf gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip maturin
          # `benchmark` extra brings polars; `dev` brings pandas + TA-Lib (the
          # references the gate compares volas against).
          pip install -e .[dev,benchmark]

      - name: Build the extension (release)
        run: maturin develop --release

      - name: Run the benchmark (coverage + core API)
        run: |
          mkdir -p .benchmarks
          pytest test/test_benchmark.py -k "test_coverage or test_api" \
            --benchmark-only --benchmark-sort=name \
            --benchmark-columns=median --benchmark-json=.benchmarks/ci.json -q

      - name: Performance gate
        if: ${{ github.event.inputs.update_baseline != 'true' }}
        run: |
          python scripts/perf_gate.py .benchmarks/ci.json \
            --baseline scripts/perf_baseline.json --threshold 0.25

      - name: Regenerate baseline (manual workflow_dispatch only)
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        run: |
          python scripts/perf_gate.py .benchmarks/ci.json \
            --baseline scripts/perf_baseline.json --update
          echo "Regenerated scripts/perf_baseline.json on the CI (x86) runner — download the"
          echo "'perf-baseline' artifact below and commit it to make the gate x86-native."

      - name: Upload regenerated baseline
        if: ${{ github.event.inputs.update_baseline == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: scripts/perf_baseline.json

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-json
          path: .benchmarks/ci.json
          retention-days: 14
