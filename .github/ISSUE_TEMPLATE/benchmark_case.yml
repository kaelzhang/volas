name: Benchmark case / challenge
description: Propose a benchmark case — including ones where volas loses
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        volas claims to be fast on **live OHLCV indicator workloads**, especially
        append-one-bar refresh. Realistic cases that contradict that — or sharpen
        it — are welcome. Benchmarks must be reproducible and compared within the
        same run.
  - type: textarea
    id: summary
    attributes:
      label: Case summary
      description: What workload should the benchmark cover, and why is it realistic?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Input shape and fixture (optional)
      description: Number of rows/columns, how the data is generated or sourced.
  - type: input
    id: indicators
    attributes:
      label: Indicators computed (optional)
      placeholder: "e.g. rsi:14, macd, atr:14"
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario (optional)
      options:
        - Batch (compute over full history)
        - Append-one-bar (incremental refresh)
        - Both
  - type: textarea
    id: script
    attributes:
      label: Reproducible script + versions + hardware (optional)
      description: The script, library versions, and the machine/OS it ran on.
      render: shell
