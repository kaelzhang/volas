name: Bug report
description: Something behaves incorrectly or crashes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction helps most, but a clear description is enough to start.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction (optional)
      description: A self-contained snippet, input frame, or directive that reproduces it.
      render: python
  - type: input
    id: version
    attributes:
      label: volas version (optional)
      placeholder: "e.g. 1.0.2 (pip show volas)"
  - type: input
    id: env
    attributes:
      label: Python / OS (optional)
      placeholder: "e.g. Python 3.12 on macOS 14 arm64"
  - type: textarea
    id: context
    attributes:
      label: Extra context (optional)
