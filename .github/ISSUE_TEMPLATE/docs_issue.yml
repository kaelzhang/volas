name: Docs issue
description: Something in the docs is wrong, missing, or unclear
labels: ["docs"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: "e.g. README Quick start, INDICATORS.md → rsi, examples/03_..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
