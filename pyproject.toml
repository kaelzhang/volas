[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = 'volas'
dynamic = ["version"]
description = 'High-performance, Rust-backed columnar kernel for stock / candlestick (OHLCV) time-series data.'
readme = 'README.md'
authors = [
  { name = 'Kael Zhang', email = 'i+pypi@kael.me' }
]
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
dependencies = [
  "numpy>=2.0.0"
]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Rust',
    'Programming Language :: Python :: Implementation :: CPython',
    'Natural Language :: English',
    'Intended Audience :: Developers',
    'Intended Audience :: Financial and Insurance Industry',
    'Operating System :: OS Independent',
    'Development Status :: 1 - Planning',
    'Topic :: Office/Business :: Financial :: Investment'
]

[project.urls]
Homepage = "https://github.com/kaelzhang/volas"

[project.optional-dependencies]
dev = [
  "coverage",
  "ruff",
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
  "twine",
  # PEP 639 / Metadata 2.4 license fields require packaging >= 24.2 to publish
  "packaging>=24.2",
  "numpy>=2.0.0",
  "mypy",
  "maturin>=1.4"
]

[tool.maturin]
# Build the volas-python workspace crate (the `volas_rs` extension module)
manifest-path = "crates/volas-python/Cargo.toml"
module-name = "volas_rs"
binding = "pyo3"
# Pure-Python package to include alongside the compiled module
python-packages = ["volas"]

[tool.mypy]
warn_return_any = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
