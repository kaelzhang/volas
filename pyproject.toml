[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = 'volas'
dynamic = ["version"]
description = 'High-performance, Rust-backed columnar kernel for stock / candlestick (OHLCV) time-series data.'
readme = 'README.md'
authors = [
  { name = 'Kael Zhang', email = 'i+pypi@kael.me' }
]
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
dependencies = [
  "numpy>=2.0.0"
]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Rust',
    'Programming Language :: Python :: Implementation :: CPython',
    'Natural Language :: English',
    'Intended Audience :: Developers',
    'Intended Audience :: Financial and Insurance Industry',
    'Operating System :: OS Independent',
    'Development Status :: 4 - Beta',
    'Topic :: Office/Business :: Financial :: Investment',
    'Topic :: Scientific/Engineering :: Information Analysis',
    'Topic :: Software Development :: Libraries :: Python Modules'
]

[project.urls]
Homepage = "https://github.com/kaelzhang/volas"
Repository = "https://github.com/kaelzhang/volas"
Issues = "https://github.com/kaelzhang/volas/issues"
Benchmark = "https://volas.ost.ai/"
Changelog = "https://github.com/kaelzhang/volas/releases"

[project.optional-dependencies]
# `dev` is everything the *test* suite needs -- this is all CI installs. It
# includes pandas / stock-pandas because the parity tests use them as oracles;
# they are test-time only, NOT runtime dependencies (volas is pandas-independent).
dev = [
  "coverage",
  "ruff",
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
  "twine",
  # Test-time oracles: the parity tests compare volas against pandas / stock-pandas
  # and TA-Lib. The `TA-Lib` wheel bundles the TA-Lib C library, so no separate
  # system install is needed in CI.
  #
  # Oracles are PINNED to the verified stream (owner decision D3, 2026-06-12): a
  # silently-newer oracle changes the expected answers and turns CI red (or worse,
  # silently moves the contract) without any code change. Upgrading an oracle is an
  # explicit maintenance commit that re-runs the full suite and updates snapshots,
  # waivers, and docs together.
  "pandas>=3.0,<3.1",
  "stock-pandas>=5.4,<5.5",
  "TA-Lib>=0.6,<0.7",
  # pyarrow is a TEST-time consumer (not a runtime dependency): it exercises the
  # Arrow / DLPack FFI glue (arrow.rs / dlpack.rs) so CI runs those unsafe paths
  # instead of skipping them via `importorskip`.
  "pyarrow>=15",
  # PEP 639 / Metadata 2.4 license fields require packaging >= 24.2 to publish
  "packaging>=24.2",
  "numpy>=2.0.0",
  "mypy",
  "pyright",
  "maturin>=1.4"
]
# `benchmark` is the extra comparison libraries used ONLY by the benchmark, never
# by the test suite. Principle: a library needed only at benchmark time belongs
# here, so CI test runs stay lean (`.[dev]`) while benchmarking installs
# `.[dev,benchmark]`. The harness skips any of these that is not importable, so
# the group is effectively optional.
benchmark = [
  "polars>=1.0",
  "pandas-ta>=0.4",
]

[tool.maturin]
# Build the volas-python workspace crate (the `volas_rs` extension module)
manifest-path = "crates/volas-python/Cargo.toml"
module-name = "volas_rs"
binding = "pyo3"
# Pure-Python package to include alongside the compiled module
python-packages = ["volas"]
# Ship the hand-written stub for the compiled module + the PEP 561 marker so type
# checkers see the full API. Static-analysis only — no runtime effect. `volas/py.typed`
# rides along via `python-packages`; the top-level `volas_rs.pyi` needs an explicit include.
include = ["volas_rs.pyi"]

[tool.mypy]
warn_return_any = true
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true

[tool.ruff.lint.per-file-ignores]
# Test-only style exemptions (the volas package itself is fully strict):
# E741 — `l` is the industry-standard OHLC low alongside o/h/c in fixtures
#        and parity helpers; renaming it degrades, not improves, readability.
# E731 — oracle/parity tables bind small lambdas by name on purpose.
# E702 — compact one-line assertion pairs in generated parity sweeps.
"test/*" = ["E741", "E731", "E702"]
