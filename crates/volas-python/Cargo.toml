[package]
name = "volas-python"
publish = false  # PyO3 cdylib (Python extension), not a crates.io library
description = "PyO3 bindings exposing volas DataFrame / Series to Python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lib]
name = "volas_rs"
crate-type = ["cdylib"]

[dependencies]
volas-core = { workspace = true }
volas-compute = { workspace = true }
volas-directive = { workspace = true }
volas-io = { workspace = true }
volas-time = { workspace = true }
volas-arrow = { workspace = true }
pyo3 = { version = "0.25", features = ["extension-module", "multiple-pymethods"] }
numpy = "0.25"
ndarray = "0.16"
